name: Build

on:
  push:
  pull_request:

jobs:
  ubuntu:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev libusb-1.0-0-dev

      - name: Configure
        run: cmake -S src/host/pixymon -B build/pixymon -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/pixymon --parallel
